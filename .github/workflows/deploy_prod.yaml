name: 🚀 Deploy Prod → Firebase App Distribution

# ──────────────────────────────────────────────────────────────
# Triggers on push to main
# ──────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main

# Prevent duplicate runs on the same branch
concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    name: Build Prod APK & Upload
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── 2. Java (for Android/Gradle) ────────────────────────
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # ── 3. Flutter ──────────────────────────────────────────
      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # ── 4. Flutter dependencies ─────────────────────────────
      - name: 📦 Install Flutter dependencies
        run: flutter pub get

      # ── 5. Create .env files from GitHub Secrets ────────────
      #    envied reads these at build_runner time, then they
      #    get baked (obfuscated) into the .g.dart files.
      - name: 🔐 Create .env files from secrets
        run: |
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env.dev
          echo "BASE_URL=${{ secrets.BASE_URL_DEV }}" >> .env.dev
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env.dev
          echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env.prod
          echo "BASE_URL=${{ secrets.BASE_URL_PROD }}" >> .env.prod
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env.prod

      # ── 6. Code generation (envied + freezed + json + etc.) ─
      - name: ⚙️ Generate envied .g.dart files only
        run: >
          dart run build_runner build
          --build-filter="lib/config/env/*.g.dart"

      # ── 7. Static analysis ──────────────────────────────────
      - name: 🔍 Flutter analyze
        run: flutter analyze --no-fatal-infos

      # ── 8. Ruby & Fastlane ──────────────────────────────────
      - name: 💎 Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: android

      # ── 9. Build APK & Upload to Firebase ───────────────────
      - name: 🚀 Build & Distribute via Fastlane
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_PROD_APP_ID }}
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
        working-directory: android
        run: bundle exec fastlane distribute_prod
